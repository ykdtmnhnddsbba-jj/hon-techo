<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本の手帖</title>
<style>
:root{
  --bg:#12131a;--panel:#1b1d27;--panel2:#242736;--line:#2e3144;--text:#ecedf3;--sub:#9da1b5;
  --accent:#ffb347;--accent2:#5eead4;--warn:#fbbf24;--ng:#f87171;--blue:#38bdf8;
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent2)}
header{position:sticky;top:0;z-index:20;background:rgba(18,19,26,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:.04em}
.logo b{color:var(--accent)}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--sub);cursor:pointer;font-weight:600}
nav button.on{background:var(--panel2);color:var(--text)}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--sub);cursor:pointer}
.chip.ok{color:var(--accent2);border-color:#2a5b55}
.chip.bad{color:var(--warn);border-color:#6b5a1c}
main{max-width:1600px;margin:0 auto;padding:18px 16px 80px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar select,.toolbar input[type=text],.field input,.field select,.field textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--text);display:inline-block}
.btn:hover{border-color:var(--sub)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#220}
.btn.danger{color:#ff9aa8}
.btn.sm{padding:4px 10px;font-size:13px}
label.chk{display:flex;gap:6px;align-items:center;color:var(--sub);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:12px}
@media(max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex}
.card:hover{border-color:#4a4f6e}
.card.dim{opacity:.55}
.cover{position:relative;width:96px;flex:none;aspect-ratio:2/3;align-self:flex-start;background:var(--panel2) center/cover no-repeat;margin:12px 0 12px 12px;border-radius:8px}
.cover .rk{position:absolute;top:-6px;left:-6px;background:var(--accent);color:#220;font-weight:800;border-radius:8px;padding:1px 9px;font-size:15px}
.cover .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:6px;text-align:center;font-size:11px;color:var(--sub)}
.cbody{flex:1;min-width:0;padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px}
.ctitle{font-size:15.5px;font-weight:700;line-height:1.35}
.meta{font-size:12.5px;color:var(--sub)}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--panel2);color:var(--sub);margin:0 4px 4px 0;border:1px solid var(--line)}
.pill.ok{color:var(--accent2);border-color:#2a5b55;background:#16312f}
.pill.warn{color:var(--warn);border-color:#6b5a1c;background:#33290d}
.pill.ng{color:var(--ng);border-color:#7a3a3a;background:#331a1a}
.pill.blue{color:var(--blue);border-color:#1f4a63;background:#10283a}
.nums{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media(max-width:1100px){.nums{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:600px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.num{background:var(--panel2);border-radius:9px;padding:5px 9px;min-width:0}
.num .l{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num .v{font-size:15px;font-weight:700;white-space:nowrap}
.num .s{font-size:10.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num.key{background:#3a2f0b;border:1px solid #8a6f1c}
.num.key .v{color:var(--warn);font-size:17px}
.num.good .v{color:var(--accent2)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qb{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--sub);white-space:nowrap;text-decoration:none}
.qb:hover{border-color:var(--sub);color:var(--text)}
.qb.on.w{color:var(--accent2);border-color:#2a5b55;background:#16312f}
.qb.on.b{color:var(--accent);border-color:#8a6f1c;background:#3a2f0b}
.why{font-size:12px;color:var(--sub)}
.why b{color:var(--text);font-weight:600}
.empty{padding:50px 10px;text-align:center;color:var(--sub)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.panel h2{margin:0 0 10px;font-size:17px}
.panel h3{margin:14px 0 6px;font-size:14px;color:var(--sub)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--sub)}
.hint{font-size:12.5px;color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.two,.three{grid-template-columns:1fr}}
.stick{position:sticky;top:var(--hh,56px);z-index:15;background:var(--bg);padding:12px 0 4px;margin:-12px 0 8px;border-bottom:1px solid var(--line)}
.budget{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.btrack{flex:1;min-width:200px;height:12px;background:var(--panel2);border-radius:99px;overflow:hidden;position:relative}
.bfill{height:100%;background:var(--accent);border-radius:99px}
.bfill.over{background:var(--ng)}
.btext{font-size:14px;white-space:nowrap}
.btext b{font-size:17px;color:var(--warn)}
.subtabs{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.subtabs button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:700;color:var(--sub)}
.subtabs button.on{background:var(--accent);border-color:var(--accent);color:#220}
.subtabs .cnt{display:inline-block;min-width:20px;text-align:center;margin-left:4px;padding:0 6px;border-radius:99px;background:rgba(0,0,0,.25);font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th{color:var(--sub);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--panel)}
table.t td.l,table.t th.l{text-align:left;white-space:normal}
.tw{overflow:auto}
.mon{padding:14px 16px}
.mh{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.mh h2{margin:0;font-size:18px}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr) 150px 120px auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bcov{width:44px;aspect-ratio:2/3;border-radius:5px;background:var(--panel2) center/cover no-repeat}
.brow .ctitle{font-size:14.5px}
.brow input{width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.bt input{margin-top:4px}
.brow .lab{font-size:10.5px;color:var(--sub)}
@media(max-width:800px){.brow{grid-template-columns:44px 1fr 1fr}.brow .bt{grid-column:2/-1}.brow>div:nth-child(3){grid-column:2}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:10px 18px;border-radius:999px;z-index:99;font-size:14px}
.ov0{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:760px;width:100%;padding:18px}
.modal h2{margin:0 0 6px;font-size:19px}
pre.code{background:var(--panel2);border-radius:10px;padding:10px;white-space:pre-wrap;font-size:12.5px}
footer{max-width:1200px;margin:0 auto;padding:0 16px 40px;color:var(--sub);font-size:12px}
.spark{display:flex;gap:2px;align-items:flex-end;height:18px}
.spark i{display:block;width:4px;background:#4a4f6e;border-radius:1px}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo">本の<b>手帖</b></div>
  <nav id="nav"></nav>
  <span id="syncChip" class="chip"></span>
</div></header>
<main id="main"></main>
<footer>
  候補データは Claude が調査日時点で Amazon.co.jp（価格・発売日・寸法）とメルカリ（売り切れ・出品中の検索結果）を確認したものです。メルカリの数値は検索結果1ページ目（最大120件）の範囲で、売れた時期は確認していません。
</footer>
<div id="modalRoot"></div>

<script>
'use strict';
/* =============== utils =============== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowIso=()=>new Date().toISOString();
const yen=n=>n==null||isNaN(n)?'—':(n<0?'−':'')+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP');
const pct=n=>n==null||isNaN(n)?'—':Math.round(n*100)+'%';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const ymOf=s=>String(s||'').slice(0,7);
function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function median(a){if(!a||!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2)}

/* =============== state =============== */
const LS_DB='hondb.v1',LS_SET='hondb.settings.v1',LS_UI='hondb.ui.v1';
const DEFAULT_CLIENT_ID='568813131190-9pb3hf0f3g3rbiglkq4nbk88g4eltk9p.apps.googleusercontent.com';
// 計算の前提（設定タブで変更可）。封筒の内寸はメーカー非公表のため推定値
const DEF_CFG={budget:10000,fee_rate:0.10,shipping:210,packaging:74,
  env_outer_w:220,env_outer_h:315,env_in_w:205,env_in_h:300,cushion:5,max_thick:30,max_weight:1000,warn_margin:10};
function emptyDb(){return{schema_version:1,updated_at:null,picks:{},purchases:{}}}
let db=Object.assign(emptyDb(),lsGet(LS_DB,{}));
let settings=Object.assign({google_client_id:DEFAULT_CLIENT_ID,drive_linked:false,cfg:{}},lsGet(LS_SET,{}));
if(!settings.google_client_id)settings.google_client_id=DEFAULT_CLIENT_ID;
const cfg=()=>Object.assign({},DEF_CFG,settings.cfg||{});
const ui=Object.assign({tab:'rank',month:null,onlyPass:true,sort:'burden',candSub:'rank'},lsGet(LS_UI,{}));
let months=[],data=null,dataErr='';

function saveLocal(){db.updated_at=nowIso();lsSet(LS_DB,db)}
function save(){saveLocal();scheduleSync()}
function saveSettings(){lsSet(LS_SET,settings)}
function saveUi(){lsSet(LS_UI,{tab:ui.tab,month:ui.month,onlyPass:ui.onlyPass,sort:ui.sort,candSub:ui.candSub})}

/* =============== 計算（ランキングの根拠） =============== */
// ネコポス判定：封筒は袋なので「本の幅＋厚さ ≤ 封筒内寸の幅」「本の高さ＋厚さ ≤ 内寸の高さ」で入る。
// 梱包後の厚さ＝本の厚さ＋クッション分。3cm超はネコポス不可。
function fitCheck(size,c=cfg()){
  if(!size||!size.h||!size.w||!size.t)return{fit:'unknown',label:'サイズ要確認',why:'寸法が確認できませんでした'};
  const h=Math.max(size.h,size.w),w=Math.min(size.h,size.w),t=size.t;   // mm
  const packed=t+c.cushion;
  const mw=c.env_in_w-(w+t),mh=c.env_in_h-(h+t),mt=c.max_thick-packed;
  const why=`梱包後の厚さ 約${packed.toFixed(0)}mm（上限${c.max_thick}）／幅の余裕 ${mw.toFixed(0)}mm／高さの余裕 ${mh.toFixed(0)}mm`;
  if(size.weight_g&&size.weight_g>c.max_weight)return{fit:'ng',label:'ネコポス不可',why:`重さ${size.weight_g}g（上限1kg）`};
  if(mt<0)return{fit:'ng',label:'ネコポス不可',why:why+' → 厚さオーバー'};
  if(mw<-c.warn_margin||mh<-c.warn_margin)return{fit:'ng',label:'封筒に入らない',why};
  if(mw<0||mh<0||mt<2)return{fit:'warn',label:'ネコポス要注意',why:why+' → ギリギリ。実物で確認を'};
  return{fit:'ok',label:'ネコポスOK',why};
}
function evalBook(b,c=cfg()){
  const m=b.mercari||{};
  const sold=(m.sold_prices||[]).filter(x=>x>0);
  const n=sold.length;
  const med=median(sold),smin=n?Math.min(...sold):null,smax=n?Math.max(...sold):null;
  const omin=m.on_sale_min||null;
  let expected=null;
  if(n>=3){expected=med;if(omin&&omin<expected)expected=Math.max(omin,smin)}
  else if(n){expected=omin?Math.min(smin,omin):smin}   // 実績1〜2件は控えめに（最安値）
  const fee=expected==null?null:Math.floor(expected*c.fee_rate);
  const net=expected==null?null:expected-fee-c.shipping-c.packaging;
  const price=b.price;
  const burden=net==null||!price?null:price-net;
  const retention=expected==null||!price?null:expected/price;
  const f=fitCheck(b.size,c);
  const reasons=[];
  if(!b.in_window)reasons.push('発売日が対象期間外');
  if(!n)reasons.push('メルカリ売却実績を確認できず');
  if(f.fit==='ng')reasons.push(f.label);
  if(f.fit==='unknown')reasons.push('サイズ要確認');
  if(!price)reasons.push('Amazon価格を確認できず');
  else if(price>c.budget)reasons.push('補助上限超え');
  if(!b.genre_ok)reasons.push('IT・ビジネス書ではない');
  return{n,med,smin,smax,omin,ocount:m.on_sale_count||0,expected,fee,net,burden,retention,fit:f,pass:!reasons.length,reasons};
}
// 総合スコア（並び替え「おすすめ順」用）。実質負担を最重視
function scoreOf(b,e){
  if(e.burden==null)return -1;
  const sBurden=Math.max(0,Math.min(1,1-e.burden/3000));        // 実質負担0円→1、3000円以上→0
  const sRet=Math.max(0,Math.min(1,e.retention||0));
  const sSold=Math.min(1,Math.log10(1+e.n)/2);                  // 99件で満点
  const sUse=((b.usefulness||3)-1)/4,sDem=((b.demand||3)-1)/4;
  const sComp=e.n?Math.max(0,1-e.ocount/Math.max(5,e.n)):0;      // 出品数が売却数より少ないほど良い
  return Math.round(100*(sBurden*.45+sRet*.15+sSold*.15+sUse*.1+sDem*.1+sComp*.05));
}

/* =============== データ読み込み =============== */
async function loadIndex(){
  try{
    const r=await fetch('data/index.json?'+Date.now());if(!r.ok)throw new Error('data/index.json '+r.status);
    const j=await r.json();months=j.months||[];
    if(!ui.month||!months.find(x=>x.month===ui.month))ui.month=months[0]&&months[0].month;
    await loadMonth(ui.month);
  }catch(e){dataErr='候補データを読み込めませんでした（'+e.message+'）';render()}
}
async function loadMonth(m){
  const it=months.find(x=>x.month===m);if(!it){data=null;render();return}
  try{const r=await fetch(it.file+'?'+Date.now());if(!r.ok)throw new Error(it.file+' '+r.status);data=await r.json();dataErr=''}
  catch(e){data=null;dataErr='候補データを読み込めませんでした（'+e.message+'）'}
  render();
}
function books(){return(data&&data.books)||[]}
function bookByIsbn(isbn){return books().find(b=>b.isbn===isbn)}

/* =============== 記録（upsert 1か所） =============== */
function setPick(isbn,on){db.picks[isbn]={want:!!on,updated_at:nowIso(),deleted:!on};save()}
function upsertPurchase(id,patch){
  const p=db.purchases[id]||{id,created_at:nowIso()};
  Object.assign(p,patch,{updated_at:nowIso()});
  db.purchases[id]=p;save();return p;
}
function newPurchaseFromBook(b){
  const id='p'+Date.now().toString(36);
  const e=evalBook(b);
  return upsertPurchase(id,{isbn:b.isbn,asin:b.asin||b.isbn,title:b.title,price_paid:b.price||0,bought_at:today(),
    expected_sell:e.expected??null,expected_burden:e.burden??null,memo:'',source_month:data&&data.month});
}
function purchases(){return Object.values(db.purchases).filter(p=>!p.deleted).sort((a,b)=>(b.bought_at||'').localeCompare(a.bought_at||'')||(b.created_at||'').localeCompare(a.created_at||''))}
function boughtIsbns(){return new Set(purchases().map(p=>p.isbn).filter(Boolean))}
function monthSpend(ym){return purchases().filter(p=>ymOf(p.bought_at)===ym).reduce((s,p)=>s+(+p.price_paid||0),0)}

/* =============== render =============== */
const TABS=[['rank','📚 候補ランキング'],['rec','🛒 買った本'],['memo','🔎 調査メモ'],['settings','⚙ 設定']];
function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${ui.tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.t;saveUi();render();window.scrollTo(0,0)});
  const m=$('#main');
  if(ui.tab==='rank')m.innerHTML=viewRank();
  else if(ui.tab==='rec')m.innerHTML=viewBought();
  else if(ui.tab==='memo')m.innerHTML=viewMemo();
  else m.innerHTML=viewSettings();
  bind();
  document.documentElement.style.setProperty('--hh',($('header').offsetHeight||56)+'px');
}
function budgetBar(){
  const c=cfg(),ym=today().slice(0,7),sp=monthSpend(ym),rest=c.budget-sp,w=Math.min(100,sp/c.budget*100);
  return `<div class="budget"><span class="btext">${+ym.slice(5)}月の購入 <b>${yen(sp)}</b> / ${yen(c.budget)}</span>
   <div class="btrack"><div class="bfill ${rest<0?'over':''}" style="width:${w}%"></div></div>
   <span class="btext">残り枠 <b style="color:${rest<0?'var(--ng)':'var(--accent2)'}">${yen(rest)}</b></span></div>`;
}
function cover(b,rank){
  const a=b.asin||b.isbn;
  return `<div class="cover" style="background-image:url('https://images-na.ssl-images-amazon.com/images/P/${esc(a)}.09.MZZZZZZZ.jpg')">${rank?`<span class="rk">${rank}</span>`:''}</div>`;
}
function fitPill(f){const cls={ok:'ok',warn:'warn',ng:'ng',unknown:'warn'}[f.fit];return `<span class="pill ${cls}" title="${esc(f.why)}">📮 ${esc(f.label)}</span>`}
function numBox(l,v,s,cls=''){return `<div class="num ${cls}"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`}
function stars(n){n=n||0;return '★'.repeat(n)+'☆'.repeat(5-n)}
function bookCard(b,e,rank,rest){
  const picked=db.picks[b.isbn]&&db.picks[b.isbn].want, bought=boughtIsbns().has(b.isbn);
  const over=b.price&&rest!=null&&b.price>rest&&!bought;
  const m=b.mercari||{};
  return `<div class="card ${over?'dim':''}" data-isbn="${esc(b.isbn)}">
    ${cover(b,rank)}
    <div class="cbody">
      <div class="ctitle">${esc(b.title)}</div>
      <div class="meta">${esc(b.author||'')}／${esc(b.publisher||'')}／発売 ${esc(b.release_date||'—')}／${b.pages?b.pages+'ページ':''}
        ${b.amazon_rank?`／Amazon本 ${Number(b.amazon_rank).toLocaleString()}位`:''}</div>

function rankedList(){
  const arr=books().map(b=>{const e=evalBook(b);return{b,e,score:scoreOf(b,e)}});
  const S={burden:(x,y)=>(x.e.burden??1e9)-(y.e.burden??1e9)||y.score-x.score,
    score:(x,y)=>y.score-x.score,
    sell:(x,y)=>(y.e.expected??-1)-(x.e.expected??-1),
    sold:(x,y)=>y.e.n-x.e.n,
    ret:(x,y)=>(y.e.retention??-1)-(x.e.retention??-1),
    date:(x,y)=>String(y.b.release_date).localeCompare(String(x.b.release_date))};
  arr.sort(S[ui.sort]||S.burden);
  return arr;
}

function bind(){
  const m=$('#main');
  const ms=$('#mSel');if(ms)ms.onchange=()=>{ui.month=ms.value;saveUi();loadMonth(ui.month)};
  const ss=$('#sortSel');if(ss)ss.onchange=()=>{ui.sort=ss.value;saveUi();render()};
  const op=$('#onlyPass');if(op)op.onchange=()=>{ui.onlyPass=op.checked;saveUi();render()};
  m.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{ui.candSub=b.dataset.sub;saveUi();render()});
  m.querySelectorAll('.card[data-isbn]').forEach(card=>{
    const b=bookByIsbn(card.dataset.isbn);
    card.querySelectorAll('[data-act]').forEach(btn=>btn.onclick=()=>{
      const a=btn.dataset.act;
      if(a==='pick'){const on=!(db.picks[b.isbn]&&db.picks[b.isbn].want);setPick(b.isbn,on);btn.classList.toggle('on',on);toast(on?'☆ 気になるに追加':'気になるから外しました')}
      else if(a==='buy'){
        if(boughtIsbns().has(b.isbn)){ui.tab='rec';saveUi();render();return}
        newPurchaseFromBook(b);toast('「買った本」に追加しました');render();
      }
      else if(a==='detail')detailModal(b);
    });
  });
  m.querySelectorAll('.brow[data-id]').forEach(row=>{
    const id=row.dataset.id;
    row.querySelectorAll('[data-f]').forEach(inp=>inp.onchange=()=>{
      const k=inp.dataset.f;let v=inp.value;
      if(k==='price_paid')v=v===''?null:+v;
      upsertPurchase(id,{[k]:v});
      if(k!=='memo')render();
    });
    const del=row.querySelector('[data-act="del"]');
    if(del)del.onclick=()=>{if(!confirm('この本を一覧から削除しますか？'))return;upsertPurchase(id,{deleted:true});render()};
  });
  const am=$('#addManual');if(am)am.onclick=()=>{
    const t=prompt('書名');if(!t)return;const pr=+prompt('購入価格（円）','')||0;
    upsertPurchase('p'+Date.now().toString(36),{title:t,price_paid:pr,bought_at:today(),memo:''});render();
  };
  const cp=$('#copyPrompt');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(RESEARCH_PROMPT);toast('コピーしました')}catch(e){toast('コピーできませんでした。手で選択してください')}window.open('https://claude.ai/','_blank','noopener')};
  m.querySelectorAll('[data-cfg]').forEach(inp=>inp.onchange=()=>{settings.cfg=settings.cfg||{};const v=parseFloat(inp.value);if(!isNaN(v))settings.cfg[inp.dataset.cfg]=v;saveSettings();toast('保存しました')});
  const cr=$('#cfgReset');if(cr)cr.onclick=()=>{settings.cfg={};saveSettings();render()};
  const gc=$('#gConnect');if(gc)gc.onclick=async()=>{settings.google_client_id=$('#gcid').value.trim()||DEFAULT_CLIENT_ID;saveSettings();if(await driveSync(true))toast('Driveと同期しました')};
  const ex=$('#exp');if(ex)ex.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(exportObj(),null,1)],{type:'application/json'}));a.download='hon-techo-db.json';a.click()};
  const im=$('#imp');if(im)im.onchange=async()=>{const f=im.files[0];if(!f)return;try{const j=JSON.parse(await f.text());db=mergeDb(db,j);save();toast('読み込みました');render()}catch(e){toast('読み込めませんでした: '+e.message)}};
}

function exportObj(){
  return{_readme:{about:'本の手帖（会社の書籍補助で買ったIT・ビジネス書）の個人データ。',
      picks:'ISBN → {want:気になる, updated_at}',
      purchases:'id → {isbn,title,price_paid:購入価格(円),bought_at:購入日,expected_sell/expected_burden:購入時点の想定売却価格・想定実質負担,memo,updated_at,deleted:削除済み}'},
    schema_version:1,updated_at:db.updated_at,picks:db.picks,purchases:db.purchases};
}
function mergeMap(a={},b={}){const o={...a};for(const[k,v]of Object.entries(b||{})){if(!v)continue;const cur=o[k];if(!cur||(v.updated_at||'')>(cur.updated_at||''))o[k]=v}return o}
function mergeDb(a,b){return Object.assign(emptyDb(),a,{picks:mergeMap(a.picks,b.picks),purchases:mergeMap(a.purchases,b.purchases)})}

let gToken=null,gExp=0,driveFileId=null,syncTimer=null,syncing=false;
const G_SCOPE='https://www.googleapis.com/auth/drive.file';
const G_REDIR=location.origin+location.pathname.replace(/index\.html$/,'');
const G_TOKKEY='hon_gauth_tok:'+G_REDIR;
const DRIVE_NAME='hon-techo-db.json';
const gSt={
  get(k){try{const v=localStorage.getItem(k);if(v!=null)return v}catch(e){}try{return sessionStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}try{sessionStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}try{sessionStorage.removeItem(k)}catch(e){}}
};
let gAuthMsg='';
(function(){
  try{
    if(/access_token=|error=/.test(location.hash)){
      const p=new URLSearchParams(location.hash.slice(1));
      const saved=gSt.get('hon_gauth_state');
      if(p.get('state')&&saved&&p.get('state')===saved){
        if(p.get('access_token'))gSt.set(G_TOKKEY,JSON.stringify({t:p.get('access_token'),e:Date.now()+(+p.get('expires_in')||3600)*1000}));
        else if(p.get('error')&&!/login_required|interaction_required|consent_required|account_selection_required/.test(p.get('error')))gAuthMsg='Google認証が完了しませんでした ('+p.get('error')+')';
      }else gAuthMsg='Google認証の戻り情報を確認できませんでした。もう一度「☁ 要再接続」を押してください';
      gSt.del('hon_gauth_state');
      history.replaceState(null,'',location.pathname+location.search);
    }
    const s=JSON.parse(gSt.get(G_TOKKEY)||'null');
    if(s&&s.e>Date.now()){gToken=s.t;gExp=s.e}else if(s)gSt.del(G_TOKKEY);
  }catch(e){}
})();
function gRedirect(prompt){
  const st=Math.random().toString(36).slice(2)+Date.now().toString(36);
  gSt.set('hon_gauth_state',st);
  const q=new URLSearchParams({client_id:settings.google_client_id.trim(),redirect_uri:G_REDIR,response_type:'token',scope:G_SCOPE,state:st,include_granted_scopes:'true'});
  if(prompt)q.set('prompt',prompt);
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+q.toString();
  return new Promise(()=>{});
}
async function driveAuth(interactive){if(interactive)return gRedirect('');throw new Error('再接続が必要です')}
function gStartup(){
  if(gAuthMsg){const m=gAuthMsg;gAuthMsg='';setTimeout(()=>toast(m,6000),400)}
  if(gToken){driveSync(false);return}
  if(!settings.drive_linked){setSync('off');return}
  const last=+gSt.get('hon_gauth_silent')||0;
  if(Date.now()-last<300000){setSync('need');return}
  gSt.set('hon_gauth_silent',String(Date.now()));
  gRedirect('none');
}
window.addEventListener('pageshow',e=>{if(e.persisted){syncing=false;setSync('need')}});
const gFetch=(url,opt={})=>fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+gToken}});
async function driveSync(interactive){
  if(syncing)return;syncing=true;setSync('busy');let changed=false;
  try{
    if(!gToken||Date.now()>gExp-60000)await driveAuth(interactive);
    let id=driveFileId;
    if(!id){
      const q=encodeURIComponent(`name='${DRIVE_NAME}' and trashed=false`);
      const r=await gFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&orderBy=${encodeURIComponent('modifiedTime desc')}&pageSize=1`);
      if(!r.ok)throw new Error('Drive検索に失敗 ('+r.status+')');
      const j=await r.json();id=j.files&&j.files[0]&&j.files[0].id;
    }
    if(id){
      const r=await gFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
      if(r.ok){const sig=JSON.stringify([db.picks,db.purchases]);const remote=await r.json();db=mergeDb(db,remote||{});saveLocal();if(JSON.stringify([db.picks,db.purchases])!==sig)changed=true}
    }
    const body=JSON.stringify(exportObj(),null,1);
    if(id){
      const r=await gFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
      if(!r.ok)throw new Error('Drive保存に失敗 ('+r.status+')');
    }else{
      const b='hondb'+Date.now();
      const meta=JSON.stringify({name:DRIVE_NAME,mimeType:'application/json'});
      const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${body}\r\n--${b}--`;
      const r=await gFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp});
      if(!r.ok)throw new Error('Drive作成に失敗 ('+r.status+')');
      id=(await r.json()).id;
    }
    driveFileId=id;settings.drive_linked=true;saveSettings();setSync('ok');
    if(changed&&ui.tab!=='settings')render();
    return true;
  }catch(e){setSync(interactive?'bad':'need');if(interactive)toast(e.message,5000);console.warn(e);return false}
  finally{syncing=false}
}
function scheduleSync(){
  if(!settings.drive_linked)return;
  setSync('dirty');clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{if(gToken&&Date.now()<gExp-60000)driveSync(false);else setSync('need')},2500);
}
function setSync(s){
  const c=$('#syncChip');
  const map={off:['☁ Drive未連携',''],need:['☁ 要再接続（クリック）','bad'],ok:['☁ 同期済み','ok'],dirty:['☁ 未同期…','bad'],busy:['☁ 同期中…',''],bad:['☁ 同期エラー（クリック）','bad']};
  const [t,cls]=map[s]||map.off;c.textContent=t;c.className='chip '+cls;
}
$('#syncChip').onclick=()=>driveSync(true);

/* =============== start =============== */
setSync(settings.drive_linked?'need':'off');
render();
loadIndex();
gStartup();
</script>
</body>
